<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Roblox Games</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
   <style>
    :root{
      --bg-1: #00110a;
      --bg-2: #002217;
      --glass: rgba(0,255,120,0.08);
      --glass-2: rgba(0,255,120,0.036);
      --accent: #00FF55; /* bright neon */
      --accent-2: hwb(144 9% 62% / 0.473); /* light neon */
      --muted: rgba(190,255,210,0.95);
      --card-radius: 16px;
      color-scheme: dark;
    }

   *{box-sizing:border-box}
    html,body{height:100%}

    /* favorites removed */
    body{
      margin:0;background:var(--bg-1);
      font-family:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial; color:#fff; -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;padding:32px;
    }

    .wrap{max-width:1200px;margin:0 auto}

    header.app-header{
      display:flex;align-items:center;gap:18px;justify-content:space-between;padding:18px;background:linear-gradient(180deg,var(--glass),transparent);border-radius:14px;border:1px solid rgba(255,255,255,0.03);backdrop-filter:blur(8px);
      box-shadow:0 8px 30px rgba(2,10,30,0.6);
    }

      .brand{display:flex;align-items:center;gap:14px}
    .logo{width:56px;height:56px;background:linear-gradient(135deg,var(--accent),var(--accent-2));border-radius:12px;display:grid;place-items:center;font-weight:700;color:#041018;box-shadow:0 12px 44px rgba(0,255,120,0.24), inset 0 0 14px rgba(0,255,120,0.08)}
    .title h1{margin:0;font-size:1.35rem;line-height:1;color:transparent;background:linear-gradient(90deg,var(--accent),var(--accent-2));background-clip:text;-webkit-background-clip:text;text-shadow:0 8px 22px rgba(0,255,120,0.08)}
    .title p{margin:3px 0 0;font-size:0.9rem;color:var(--muted)}

    .controls{display:flex;gap:12px;align-items:center}
    .search{display:flex;align-items:center;gap:8px;background:var(--glass);padding:8px;border-radius:12px;border:1px solid rgba(255,255,255,0.03)}
    .search input{background:transparent;border:0;color:#fff;outline:none;padding:6px 8px;min-width:0;width:clamp(120px,34vw,220px)}
    select#lang-select{
      -webkit-appearance:none;
      -moz-appearance:none;
      appearance:none;
      background-color: #000; /* solid black background */
      background: linear-gradient(180deg, #000, #000); /* force black across browsers */
      border: 1px solid rgba(255,255,255,0.04);
      color: #fff;
      padding: 8px 34px 8px 10px;
      border-radius: 10px;
      outline: none;
      min-width: 88px;
      background-image: url('data:image/svg+xml;charset=UTF-8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 width=%2218%22 height=%2218%22%3E%3Cpolyline points=%226 9 12 15 18 9%22 stroke=%22%23ffffff%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22 fill=%22none%22/%3E%3C/svg%3E');
      background-repeat: no-repeat;
      background-position: right 8px center;
      background-size: 18px;
      cursor: pointer;
    }

    /* Many native select dropdowns are rendered by the OS and ignore option styles.
       This attempts to force dark options where supported. */
    select#lang-select option{
      background-color: #000 !important;
      color: #fff !important;
      padding: 6px 8px;
    }

    /* Windows/Edge caret fix */
    select#lang-select::-ms-expand{filter:invert(1);}    

    /* Custom flag dropdown (fallback for native select) */
    .lang-dropdown{position:relative}
    #lang-toggle{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(180deg,var(--bg-2),var(--bg-1));border:1px solid rgba(255,255,255,0.04);color:#fff;padding:8px 10px;border-radius:10px;cursor:pointer;min-width:88px}
    #lang-toggle img{width:18px;height:12px;object-fit:cover;border-radius:2px}
    #lang-toggle span{font-size:0.95rem}
    #lang-toggle.lang-anim{animation:langPulse .52s cubic-bezier(.2,.9,.2,1)}
    @keyframes langPulse{0%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(0,255,120,0))}40%{transform:scale(1.06);filter:drop-shadow(0 8px 28px rgba(0,255,120,0.12))}100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(0,255,120,0))}}
    #lang-menu{position:absolute;right:0;margin-top:8px;background:var(--bg-1);border:1px solid rgba(255,255,255,0.04);border-radius:10px;list-style:none;padding:8px;box-shadow:0 10px 36px rgba(0,0,0,0.5);z-index:999}
    #lang-menu li{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;cursor:pointer;color:var(--muted)}
    #lang-menu li:hover{background:rgba(0,255,120,0.04);color:#fff}
    #lang-menu li img{width:18px;height:12px;object-fit:cover;border-radius:2px}

    .hero{margin:28px 0 18px;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .hero .left{flex:1}
    .hero h2{margin:0;font-size:2.2rem;letter-spacing:-0.6px}
    .hero p{margin:10px 0 0;color:var(--muted);max-width:60%}

    .categories{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
    .cat-btn{padding:14px 22px;border-radius:18px;border:1px solid rgba(0,0,0,0.12);background:rgba(0,50,35,0.4);color:var(--accent);font-weight:700;font-size:1.05rem;cursor:pointer;transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s cubic-bezier(.2,.8,.2,1),background-color .18s,color .18s;will-change:transform,box-shadow;transform:translateZ(0)}
    .cat-btn:focus{outline:none;transform:translate3d(0,-2px,0) scale(1.03);box-shadow:0 18px 48px rgba(0,140,100,0.12),0 0 16px rgba(0,140,100,0.06)}
    .cat-btn:hover{transform:translate3d(0,-4px,0) scale(1.03);box-shadow:0 24px 72px rgba(0,170,120,0.16)}
     /* When pressing the category button, use the original text color as background
       and invert text color for contrast to avoid a dark flash on click. */
     .cat-btn:active{transform:translateY(0) scale(.995);background:var(--accent);color:#041018;box-shadow:0 18px 48px rgba(0,140,100,0.12)}
     .cat-btn.active{background:var(--accent);color:#041018;box-shadow:0 24px 84px rgba(0,200,140,0.34);transform:translateY(-6px)}
    main#game-list{margin-top:26px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}

    .card{background:linear-gradient(180deg, rgba(0,50,35,0.4), rgba(255,255,255,0.01));border-radius:var(--card-radius);overflow:hidden;border:1px solid rgba(255,255,255,0.03);display:flex;flex-direction:column;transition:transform .26s cubic-bezier(.2,.8,.2,1),box-shadow .26s cubic-bezier(.2,.8,.2,1);backdrop-filter:blur(6px);touch-action:manipulation;will-change:transform,box-shadow;transform:translateZ(0)}
    .card:hover{transform:translate3d(0,-8px,0) scale(1.02);box-shadow:0 22px 72px rgba(0,255,120,0.18), 0 8px 28px rgba(0,0,0,0.55);border-color:rgba(0,255,120,0.14)}
    .thumb{height:auto;aspect-ratio:16/9;background-size:cover;background-position:center;width:100%;will-change:background-position,transform;transition:transform .24s cubic-bezier(.2,.8,.2,1),background-position .24s cubic-bezier(.2,.8,.2,1)}
    .card-body{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
    .meta{display:flex;align-items:center;justify-content:space-between}
    .badge{font-size:12px;color:var(--muted)}
    .fav-btn{background:transparent;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 6px;line-height:1;transition:color .18s}
    .fav-btn:hover{color:var(--accent)}
    .fav-btn:focus{outline:none;box-shadow:0 0 0 2px rgba(0,255,120,0.6)}
    .card-actions{display:flex;gap:8px;margin-top:8px}
    .action-btn{background:rgba(0,255,120,0.12);border:1px solid rgba(0,255,120,0.2);border-radius:10px;color:#fff;font-size:0.85rem;padding:6px 10px;cursor:pointer;transition:transform .15s,background .15s;}
    .action-btn:hover{background:rgba(0,255,120,0.2);transform:translateY(-1px)}
    .action-btn:focus{outline:none;box-shadow:0 0 0 2px rgba(0,255,120,0.6)}

    /* Make card clickable as a link */
    .card-link{display:flex;flex-direction:column;height:100%;text-decoration:none;color:inherit}

    /* Ensure game name links never show an underline or bottom border (force override) */
    a.name, .card a.name {
      text-decoration: none !important;
      -webkit-text-decoration: none !important;
      -webkit-text-decoration-line: none !important;
      text-decoration-line: none !important;
      text-decoration-color: transparent !important;
      border-bottom: none !important;
      color: var(--accent) !important;
      transition: color .18s cubic-bezier(.2,.8,.2,1),transform .18s;
      will-change:color,transform;
    }
    a.name:hover, a.name:active { text-decoration: none !important; }
    a.name:focus-visible{outline:none;box-shadow:0 8px 28px rgba(0,255,120,0.08)}

    /* add-game / modal styles retained for reference; the
       interactive form and button have been removed from the page */

    /* Toast Notification */
    .toast{position:fixed;bottom:24px;right:24px;background:var(--accent);color:#041018;padding:14px 20px;border-radius:8px;font-weight:600;box-shadow:0 8px 24px rgba(0,210,122,0.3);animation:slideIn .3s ease-out;z-index:99999}
    @keyframes slideIn{from{transform:translateX(400px);opacity:0}to{transform:translateX(0);opacity:1}}
    @keyframes slideOut{from{transform:translateX(0);opacity:1}to{transform:translateX(400px);opacity:0}}
    .toast.removing{animation:slideOut .3s ease-in}
    @media (max-width:640px){.toast{bottom:16px;right:16px;left:16px;width:auto}}

    footer{margin-top:34px;text-align:center;color:rgba(255,255,255,0.45);font-size:13px}

    @media (max-width:1000px){
      .grid{grid-template-columns:repeat(2,1fr)}
      .hero p{max-width:100%}
      body{padding:24px}
    }
    @media (max-width:640px){
      body{padding:16px}
      .grid{grid-template-columns:1fr}
      .hero{flex-direction:column;align-items:flex-start;gap:14px}
      .hero h2{font-size:1.5rem}
      .hero p{max-width:100%;font-size:0.95rem}
      .wrap{padding:0}
      header.app-header{border-radius:12px;padding:14px}
      .categories{margin-top:12px}
    }

    /* Mobile (small phones) tweaks */
    @media (max-width:480px){
      body{padding:10px;font-size:16px}
      header.app-header{flex-direction:column;align-items:flex-start;gap:12px;padding:14px;border-radius:12px}
      header.app-header .brand{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px}
      .controls{width:100%;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
      .search{flex:1;min-width:0;width:100%;min-height:44px;border-radius:10px}
      .search input{width:100%;min-width:0;padding:10px 8px;font-size:16px}
      .search svg{width:20px;height:20px}
      select#lang-select{min-width:70px;padding:10px 10px;min-height:44px;font-size:16px}
      .logo{width:50px;height:50px}
      .hero{margin:16px 0 12px}
      .hero h2{font-size:1.35rem;margin-bottom:8px}
      .hero p{font-size:0.9rem}
      .categories{gap:8px}
      .cat-btn{padding:12px 14px;font-size:0.9rem;min-height:44px;border-radius:16px}
      .thumb{aspect-ratio:16/9;height:auto;min-height:100px}
      .name{white-space:normal;font-size:0.95rem;line-height:1.3;text-decoration:none;color:var(--accent)}
      a.name, .card a.name { text-decoration: none !important; border-bottom: none !important; color: inherit !important }
      .card{border-radius:12px;gap:6px}
      .card-body{padding:10px 12px;gap:6px}
      .meta{gap:8px}
      .badge{font-size:11px}
    }

    /* Extra mobile improvements: category scrolling, larger tap targets, responsive logo image */
    @media (max-width:520px){
      .categories{overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch;gap:8px;scroll-behavior:smooth}
      .categories::-webkit-scrollbar{height:4px}
      .categories::-webkit-scrollbar-track{background:transparent}
      .categories::-webkit-scrollbar-thumb{background:rgba(0,255,120,0.3);border-radius:2px}
      .cat-btn{white-space:nowrap;flex:0 0 auto;padding:12px 16px;font-size:0.95rem;min-height:44px;touch-action:manipulation}
      .open{padding:12px 14px;font-size:1rem}
      .thumb{min-height:120px}
      .card{border-radius:12px}
    }

    /* Extra small phones (under 360px) */
    @media (max-width:360px){
      body{padding:8px}
      header.app-header{padding:12px;gap:10px}
      .logo{width:44px;height:44px}
      .title h1{font-size:1.1rem}
      .title p{font-size:0.8rem}
      .hero h2{font-size:1.2rem}
      .search input{font-size:16px;padding:8px 6px}
      select#lang-select{min-width:64px;font-size:14px}
      .cat-btn{padding:10px 12px;font-size:0.85rem}
      .name{font-size:0.9rem;text-decoration:none;color:var(--accent)}
      a.name:hover, a.name:active { text-decoration: none !important; color: var(--accent) !important; }
      .badge{font-size:10px}
    }

    /* Landscape mode adjustments */
    @media (max-height:500px){
      header.app-header{padding:12px}
      .hero h2{font-size:1.3rem;margin-bottom:4px}
      .hero p{display:none}
      .grid{gap:12px}
      .card{border-radius:10px}
    }

    /* Ensure the inserted logo image scales and preserves rounded corners */
    .logo img{display:block;width:100%;height:100%;object-fit:cover;border-radius:12px;filter:drop-shadow(0 12px 36px rgba(0,255,120,0.22))}

    /* Animations: neon pulse, hue shift, scroll reveal and progress bar */
    @keyframes neon-pulse { 0% { filter: drop-shadow(0 0 6px rgba(0,255,85,0.6)) saturate(1.2); transform: translateZ(0) scale(1); } 50% { filter: drop-shadow(0 0 18px rgba(0,255,85,0.95)) saturate(1.6); transform: translateZ(0) scale(1.02); } 100% { filter: drop-shadow(0 0 6px rgba(0,255,85,0.6)) saturate(1.2); transform: translateZ(0) scale(1); } }
    @keyframes hue-rotate { 0% { filter: hue-rotate(0deg); } 50% { filter: hue-rotate(60deg); } 100% { filter: hue-rotate(0deg); } }

    .pulse { animation: neon-pulse 2.6s ease-in-out infinite; }
    .hue-animate { animation: hue-rotate 8s linear infinite; }

    /* Scroll reveal defaults */
    .reveal-on-scroll { opacity: 0; transform: translateY(14px) scale(.995); transition: opacity 420ms ease, transform 520ms cubic-bezier(.2,.9,.2,1); will-change: opacity, transform; }
    .reveal-on-scroll.revealed { opacity: 1; transform: translateY(0) scale(1); }

    /* Utility to disable animations on an element */
    .no-anim{ animation: none !important; transition: none !important; }
    .no-anim *{ animation: none !important; transition: none !important; }
    .cat-btn.no-anim{ transform: none !important; box-shadow: none !important; }

    /* subtle entrance */
    .fade-in{animation:fadeIn .5s cubic-bezier(.2,.8,.2,1) both}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    
    /* Game mode change animations */
    @keyframes gameCardEnter{from{opacity:0;transform:translateY(20px) scale(0.95)}to{opacity:1;transform:translateY(0) scale(1)}}
    .game-card-enter{animation:gameCardEnter .48s cubic-bezier(0.2,0.8,0.2,1) forwards}
    
    @keyframes gameModeExit{from{opacity:1}to{opacity:0}}
    .game-mode-exit{animation:gameModeExit .25s ease-out forwards}
    
    /* Card entrance animation with stagger */
    @keyframes cardEnter { from { opacity: 0; transform: translateY(12px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
    /* highlight found card briefly */
    .found-highlight{box-shadow:0 0 0 4px rgba(0,255,120,0.12), 0 18px 48px rgba(0,255,120,0.12)!important;transform:translate3d(0,-6px,0) scale(1.02)!important;transition:box-shadow .22s, transform .18s}
    .card-enter { animation: cardEnter 0.45s cubic-bezier(.2,.8,.2,1) forwards; }

    /* Progress bar */
    #scroll-progress { position: fixed; left:0; top:0; height:4px; width:0%; z-index:9999; background: linear-gradient(90deg,var(--accent),var(--accent-2)); box-shadow: 0 2px 8px rgba(0,255,85,0.18); transition: width 120ms linear; }
 
    /* Language selection animation */
    .lang-toggle.lang-anim{animation:langSelectAnim .42s cubic-bezier(.2,.8,.2,1) both}
    @keyframes langSelectAnim{0%{transform:translateY(0) scale(1);opacity:1}40%{transform:translateY(-6px) scale(1.06);opacity:1}100%{transform:none;opacity:1}}

    /* Scroll-to-top button */
    #scroll-top {
      position: fixed;
      right: 18px;
      bottom: 18px;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.6);
      color: #fff;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 12px 34px rgba(0,0,0,0.45);
      transition: transform .18s ease, opacity .18s ease;
      z-index: 9999;
    }
    #scroll-top:hover { transform: translateY(-2px); }
    #scroll-top.show { display: flex; opacity: 1; }
    #scroll-top.hide { opacity: 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="app-header fade-in">
      <div class="brand">
          <div class="logo"><img src="https://play-lh.googleusercontent.com/WNWZaxi9RdJKe2GQM3vqXIAkk69mnIl4Cc8EyZcir2SKlVOxeUv9tZGfNTmNaLC717Ht" alt="Roblox logo: stylized letter R in bold white displayed on a vibrant green gradient square background. The logo represents the Roblox gaming platform and serves as a recognizable brand identifier for the gaming portal." style="width:100%;height:100%;object-fit:contain;border-radius:8px"></div>
        <div class="title"><h1>Roblox Games</h1><p>Curated collection — choose a category to explore</p></div>
      </div>

      <div class="controls">
        <div class="search">
          <input type="text" id="search-input" placeholder="Search games...">
        </div>
        <!-- language translation selector -->
        <div id="lang-dropdown" class="lang-dropdown" role="application" style="margin-top:8px;max-width:600px;display:flex;align-items:center;gap:8px">
        <button id="lang-toggle" class="lang-toggle" aria-haspopup="listbox" aria-expanded="false" style="display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:8px;background:transparent;border:1px solid rgba(255,255,255,0.03);color:inherit;cursor:pointer">
          <img id="current-flag" src="https://upload.wikimedia.org/wikipedia/en/a/a4/Flag_of_the_United_States.svg" alt="US flag" style="width:26px;height:16px;border-radius:2px;object-fit:cover;box-shadow:0 1px 2px rgba(0,0,0,0.25)">
          <span id="current-label" style="font-weight:600;color:var(--muted);font-size:1rem">English</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="opacity:.9"><polyline points="6 9 12 15 18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <ul id="lang-menu" class="lang-menu" role="listbox" aria-label="Choose language" style="list-style:none;margin:6px 0 0 0;padding:6px;border-radius:8px;background:rgba(0,0,0,0.9);border:1px solid rgba(255,255,255,0.03);position:absolute;display:none;z-index:999;min-width:160px">
          <li role="option" data-lang="en" data-flag="https://upload.wikimedia.org/wikipedia/en/a/a4/Flag_of_the_United_States.svg" style="display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;color:#fff"> <img src="https://upload.wikimedia.org/wikipedia/en/a/a4/Flag_of_the_United_States.svg" alt="US flag" style="width:26px;height:16px;object-fit:cover"> English</li>
          <li role="option" data-lang="ru" data-flag="https://upload.wikimedia.org/wikipedia/en/f/f3/Flag_of_Russia.svg" style="display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;color:#fff"> <img src="https://upload.wikimedia.org/wikipedia/en/f/f3/Flag_of_Russia.svg" alt="Russia flag" style="width:26px;height:16px;object-fit:cover"> Русский</li>
          <li role="option" data-lang="hy" data-flag="https://upload.wikimedia.org/wikipedia/commons/2/2f/Flag_of_Armenia.svg" style="display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;color:#fff"> <img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Flag_of_Armenia.svg" alt="Armenia flag" style="width:26px;height:16px;object-fit:cover"> Հայերեն</li>
        </ul>
      </div>
    </header>

    <section class="hero wrap">
      <div class="left">
          <div class="categories" role="tablist" aria-label="Categories">
          <button id="tycoon-btn" class="cat-btn">Tycoon</button>
          <button id="simulator-btn" class="cat-btn">Simulator</button>
          <button id="more-btn" class="cat-btn">Other</button>
          <button id="donate-btn" class="cat-btn">Donate</button>
          <button id="favorites-btn" class="cat-btn" style="display:none">Favorites</button>
          <div id="list-status" aria-live="polite" style="margin-left:auto;color:var(--muted);font-size:0.95rem;white-space:nowrap"></div>
        </div>
      </div>
    </section>

    <main id="game-list" class="fade-in">
      <div id="list-inner" class="grid"></div>
    </main>



  <script>

    // smarter fuzzy-matching plot identifier that returns match + category + score
    function levenshtein(a, b){
      if (!a || !b) return (a===b)?0:Math.max(a.length,b.length);
      const A = a.split(''); const B = b.split('');
      const m = A.length, n = B.length; const dp = Array.from({length:m+1}, ()=>Array(n+1).fill(0));
      for (let i=0;i<=m;i++) dp[i][0]=i;
      for (let j=0;j<=n;j++) dp[0][j]=j;
      for (let i=1;i<=m;i++){
        for (let j=1;j<=n;j++){
          const cost = A[i-1]===B[j-1]?0:1;
          dp[i][j] = Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+cost);
        }
      }
      return dp[m][n];
    }

    function trigrams(s){
      const t = s.replace(/\s+/g,' ');
      const out = new Set();
      for (let i=0;i<t.length-2;i++) out.add(t.slice(i,i+3));
      return out;
    }

    function normalizeWords(s){

    function guessGame(plot){
      const raw = (plot||'').toLowerCase().trim();
      if (!raw) return null;

      // If input is in a localized language (ru/hy), try to replace known localized game names
      // with their English equivalents so fuzzy matching works against English titles.
      let englishText = raw;
      if (currentLang && currentLang !== 'en') {
        for (const key in games) {
          for (const g of games[key]) {
            const local = (typeof g.name === 'string') ? g.name : (g.name && g.name[currentLang]) || '';
            const en = (typeof g.name === 'string') ? g.name : (g.name && g.name.en) || '';
            if (local && en) {
              const ln = local.toLowerCase();
              const esc = ln.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
              englishText = englishText.replace(new RegExp(esc, 'g'), en.toLowerCase());
            }
          }
        }
      }

      const plotWords = normalizeWords(englishText);
      const plotTris = trigrams(englishText);

      let best = { key: null, game: null, score: 0 };

      for (const key in games) {
        for (const g of games[key]) {
          const enName = (typeof g.name === 'string') ? g.name : (g.name && g.name.en) || '';
          const enLower = enName.toLowerCase();
          const localName = (typeof g.name === 'string') ? g.name : (g.name && g.name[currentLang]) || '';
          const localLower = (localName || '').toLowerCase();

          // exact localized match or exact English match -> highest confidence
          if ((localLower && raw.includes(localLower)) || englishText.includes(enLower) || enLower.includes(englishText)) {
            return { key, game: g, score: 999 };
          }

          const nameWords = normalizeWords(enLower);
          // token overlap (against English-translated plot)
          let overlap = 0;
          for (const w of nameWords){ if (plotWords.includes(w)) overlap += 1; }

          // levenshtein similarity (normalized) against English names
          const levDist = levenshtein(englishText, enLower);
          const levMax = Math.max(englishText.length, enLower.length) || 1;
          const levSim = 1 - (levDist / levMax);

          // trigram similarity
          const nameTris = trigrams(enLower);
          const inter = Array.from(nameTris).filter(t=>plotTris.has(t)).length;
          const uni = new Set([...nameTris, ...plotTris]).size || 1;
          const triSim = inter / uni;

          let score = (overlap * 18) + (levSim * 36) + (triSim * 28);

          // boost for shared keywords
          if (enLower.includes('tycoon')) {
            if (englishText.includes('tycoon') || raw.includes('магнат') || raw.includes('тайкун') || raw.includes('տայկոն')) score += 8;
          }
          if (enLower.includes('simulator') || enLower.includes('sim')){
            if (englishText.includes('sim') || raw.includes('сим') || raw.includes('սիմուլ')) score += 8;
          }

          if (score > best.score){ best = { key, game: g, score }; }
        }
      }
      return best.game ? best : null;
    }

    // Translate localized game names within text to English, handling punctuation/emoji
    function translateGameNamesToEnglish(text){
      if (!text) return text;
      let result = text;
      // helper to normalize (remove emojis, punctuation except spaces)
      const normalize = (s) => (s||'').toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, ' ').replace(/\s+/g, ' ').trim();
      for (const key in games){
        for (const g of games[key]){
          const en = (typeof g.name === 'string') ? g.name : (g.name && g.name.en) || '';
          ['ru','hy'].forEach(lang=>{
            const local = (typeof g.name === 'string') ? g.name : (g.name && g.name[lang]) || '';
            if (local && en){
              const normLocal = normalize(local);
              const normResult = normalize(result);
              // if the normalized local name appears in normalized text, replace all occurrences with English
              if (normLocal && normResult.includes(normLocal)){
                // perform case-insensitive replacement on original result using word boundaries
                const pattern = normLocal.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
                const regex = new RegExp('\\b' + pattern + '\\b', 'gi');
                result = result.replace(regex, en);
              }
            }
          });
        }
      }
      return result;
    }

    // Split input into multiple possible game mentions (e.g. "zombie tycoon joins bee tycoon")
    function parseMultipleGames(text){

      // split on common connectors and clean fragments (remove trailing verbs/connectors)
      const parts = text.split(/\s+(?:joins?|and|,|vs|v|meets?|with)\s+/i).map(s=>s.trim()).filter(Boolean);
      const clean = parts.map(p=>{
        // remove trailing connector-like words that may appear at end (e.g. "bee tycoon joins")
        return p.replace(/\b(?:joins|join|meets|meet|with|and|vs|v)\b[\W_]*$/i, '').trim();
      }).filter(Boolean);
      return clean;
    }

    function debounce(fn, wait){

    function throttle(fn, wait){

        }
      };
    }

                const py = ((e.clientY || (e.touches && e.touches[0].clientY)) - rect.top) / rect.height;
                const clampedX = Math.max(0, Math.min(1, px));
                const clampedY = Math.max(0, Math.min(1, py));
                const rotY = (clampedX - 0.5) * 12; // degrees
                const rotX = (0.5 - clampedY) * 8;  // degrees

            card.addEventListener('pointermove', onMove);

          }

        updateScrollBtn();
        const scrollBtn = document.getElementById('scroll-top');
        if (scrollBtn) scrollBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
      })();
  </script>
  <button id="scroll-top" aria-label="Scroll to top">↑</button>
</body>
</html>
